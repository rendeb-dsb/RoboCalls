<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>RoboCalls b1v13</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=b1v13">
</head>
<body>
  <main class="app">
    <header class="app-title">
      <span class="version">b1v13</span>
      <h1>RoboCalls</h1>
      <span id="elapsed" class="version elapsed">00:00:00</span>
      <button id="dateButton" class="date-button" type="button" aria-label="Change date"></button>
      <input id="datePicker" type="date" aria-label="Choose call date">
    </header>
    <div class="timer-controls">
      <label><input id="keepLitCheck" type="checkbox"> Keep Lit</label>
      <div class="data-buttons"><button id="exportButton" type="button">Export</button><button id="importButton" type="button">Import</button></div>
      <label><input id="pausedCheck" type="checkbox"> Paused</label>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>

    <section class="goal-panel" aria-label="Goal and progress">
      <div class="goal-entry">
        <label for="goal">Goal:</label>
        <input id="goal" type="number" min="0" max="999" step="1" inputmode="numeric" value="0" aria-describedby="goal-help">
        <div class="progress-metrics">
          <span id="count" class="metric">Count: 0</span>
          <span id="remaining" class="metric">Remaining: 0</span>
        </div>
        <div id="progressDots" class="progress-dots" role="img" aria-label="Progression: 0 of 10 goal progress steps complete" title="Progression"></div>
        <div class="block-controls">
          <label class="new-block-control"><input id="newBlockCheck" type="checkbox" checked> New Block</label>
          <span id="blockCount" class="metric">Block Count: 30</span>
        </div>
      </div>
      <div class="rate-summary" aria-live="off">
        <span id="rateHour">Calls/hour: 0.0</span>
        <span id="rate15">15 min: 0.0</span>
        
        <span id="rate5">5 min: 0.0</span>
        <span id="rate1">min: 0.0</span>
        <span id="rateDone">Est. Done: --:--</span>
      </div>
      <div class="action-entry">
        <button id="doneButton" type="button">Done</button>
        <button id="removeLastButton" type="button">Remove Last</button>
        <button id="resetButton" type="button">Reset</button>
        <button id="listButton" type="button">List</button>
      </div>
    </section>
    <div id="goal-help" class="sr-only">Enter an integer from 0 through 999. Use Reset to clear all outcome counters.</div>
    <p id="message" role="status" aria-live="polite"></p>

    <div id="mainScreen">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th class="radio-col" scope="col">Select</th><th class="count-col" scope="col">Count</th><th scope="col">Outcome</th><th class="percent-col" scope="col">%</th></tr>
          </thead>
          <tbody id="outcomes"></tbody>
        </table>
      </div>
    </div>
    <section id="listScreen" hidden>
      <button id="backButton" type="button">Back</button>
      <div class="list-table-wrap">
        <table id="historyTable"><thead id="historyHead"></thead><tbody id="historyBody"></tbody></table>
      </div>
    </section>
    <div id="confirmDialog" class="confirm-backdrop" hidden>
      <section class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">The RoboCall app says:</h2>
        <p>Are you sure?</p>
        <div><button id="confirmYes" type="button">Yes</button><button id="confirmNo" type="button">No</button></div>
      </section>
    </div>
  </main>
  <script src="app.js?v=b1v13"></script>
</body>
</html>
